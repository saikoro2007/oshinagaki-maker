<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Japanese Vermilion Red Seal Stamp (落款印 / Hanko) -->
  <rect x="3" y="3" width="58" height="58" rx="10" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="1 1"/>
  
  <!-- Stylized Kanji "品" in Seal Script (篆書体) -->
  <!-- Top box -->
  <rect x="23" y="13" width="18" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Bottom left box -->
  <rect x="13" y="34" width="17" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Bottom right box -->
  <rect x="34" y="34" width="17" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Subtle authentic stamp roughness dots -->
  <circle cx="20" cy="18" r="1" fill="#b91c1c"/>
  <circle cx="45" cy="42" r="1.2" fill="#b91c1c"/>
</svg>